[build]
  publish = "."
  # Evita consumir builds cuando solo cambian documentación, tests o CI.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)LICENSE' ':(exclude).github/**' ':(exclude)tests/**' ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude).gitleaks.toml'"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/explain"
  to = "/.netlify/functions/explain"
  status = 200
  force = true
